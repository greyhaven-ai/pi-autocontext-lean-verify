name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    environment: publish-pi-autocontext-lean-verify
    permissions:
      contents: read
      id-token: write
    env:
      NPM_CONFIG_MIN_RELEASE_AGE: "7"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Verify npm supports trusted publishing
        run: |
          npm_version="$(npm --version)"
          echo "npm ${npm_version}"
          major="${npm_version%%.*}"
          if [ "${major}" -lt 11 ]; then
            echo "npm ${npm_version} is too old for trusted publishing; update the Node.js toolchain." >&2
            exit 1
          fi

      - name: Validate package invariants
        run: npm run validate

      - name: Check package contents
        run: npm pack --dry-run --json

      - name: Install elan and Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain stable --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify bundled expected proofs
        run: python3 tests/verify_expected_proofs.py

      - name: Verify release tag matches package version
        run: |
          node - <<'NODE'
          const packageJson = require('./package.json');
          const expected = `v${packageJson.version}`;
          const actual = process.env.GITHUB_REF_NAME;
          if (actual !== expected) {
            throw new Error(`Release tag ${actual} does not match package version ${expected}`);
          }
          NODE

      - name: Publish to npm with trusted publishing
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN
          npm publish --ignore-scripts --provenance --access public
