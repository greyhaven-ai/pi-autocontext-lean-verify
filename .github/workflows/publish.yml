name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    environment: publish-pi-autocontext-lean-verify

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install npm dependencies
        run: npm ci

      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Validate package invariants
        run: npm run validate

      - name: Check package contents
        run: npm pack --dry-run --json

      - name: Install elan and Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain stable --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify bundled expected proofs
        run: python3 tests/verify_expected_proofs.py

      - name: Verify release tag matches package version
        run: |
          node - <<'NODE'
          const packageJson = require('./package.json');
          const expected = `v${packageJson.version}`;
          const actual = process.env.GITHUB_REF_NAME;
          if (actual !== expected) {
            throw new Error(`Release tag ${actual} does not match package version ${expected}`);
          }
          NODE

      - name: Print OIDC claims for npm trusted publisher diagnostics
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          request_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          request_token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          separator = "&" if "?" in request_url else "?"
          url = f"{request_url}{separator}audience=npm:registry.npmjs.org"
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {request_token}"})
          with urllib.request.urlopen(req, timeout=30) as response:
              token = json.load(response)["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in [
              "iss",
              "aud",
              "sub",
              "repository",
              "repository_owner",
              "repository_id",
              "ref",
              "ref_type",
              "workflow",
              "workflow_ref",
              "job_workflow_ref",
              "environment",
              "event_name",
          ]:
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Publish to npm with trusted publishing
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN
          npm publish --provenance --access public
